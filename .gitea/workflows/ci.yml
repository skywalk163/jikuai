# 极快 JiKuai · 本地 CI（Gitea Actions，FreeBSD host 模式，无 Docker）
#
# 依赖安装改为「持久 venv 复用」：第三方依赖（pytest）装进
# /var/db/act_runner/venvs/jikuai 跨 run 复用；项目自身 editable 指向
# /var/db/act_runner/venvs/jikuai.src（每 run ln -sfn $PWD 更新）。
#
# 编译器：这台 runner 上**没有 gcc**，用的是 FreeBSD base system 自带的 clang
# （`cc` 指向它）。AOT 端到端用例照样真跑——`tools/aot/.../driver.py` 的
# `_CC_CANDIDATES` 是 ("gcc", "clang", "cc", "zig", "cl")，gcc 缺席时命中 clang。
# 本文件曾写「gcc 已在 runner 预装」并据此硬查 gcc，那是错的，W125 已修。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: freebsd
    steps:
      - name: Checkout
        uses: http://192.168.1.5:3000/actions/checkout@v4

      - name: 准备持久 venv（第三方依赖复用）
        run: |
          # coverage[toml] 与 pytest 一起进持久 venv —— 覆盖率门禁那步要用。
          # build 是 W121 加的：G20 wheel 内容门禁与 wheel e2e 都要 `python -m build`。
          VENV_BIN="$(/usr/local/sbin/ci_venv.sh jikuai 'pytest coverage[toml] build')"
          echo "VENV_BIN=$VENV_BIN" >> "$GITHUB_ENV"
          ln -sfn "$PWD" "/var/db/act_runner/venvs/jikuai.src"
          "$VENV_BIN/pip" install -e "/var/db/act_runner/venvs/jikuai.src" --no-build-isolation >/dev/null 2>&1 || "$VENV_BIN/pip" install -e . --no-build-isolation >/dev/null 2>&1 || true


      - name: 确认 C 编译器在位（AOT 端到端用例需要）
        run: |
          . "$VENV_BIN/activate"
          # W125 修假红：原步骤硬跑 `gcc --version` 且只认 gcc，但 FreeBSD base
          # system 自带的是 clang（cc 指向它），runner 上根本没有 gcc——这一步
          # 每次都红在编译器探测上，跟真正要跑的 AOT 用例无关。AOT 探测走
          # shutil.which('gcc'|'clang'|'cc'|'cl')，cc/clang 命中就够；.github 的
          # freebsd job 也是查 cc/clang（注释明写「不需要装 gcc」）。两处口径对齐。
          cc --version || clang --version
          python -c "import shutil, sys; c = shutil.which('gcc') or shutil.which('clang') or shutil.which('cc'); print('cc ->', c); sys.exit(0 if c else 1)"

      - name: 运行全部测试
        run: |
          . "$VENV_BIN/activate"
          python -m pytest -v

      - name: 契约门禁 G10-G19
        run: |
          . "$VENV_BIN/activate"
          python scripts/check_stdlib_contract.py

      - name: 守卫 - AOT e2e 必须运行（非 skip）
        run: |
          . "$VENV_BIN/activate"
          # 用 glob 覆盖全部 AOT 测试文件（含 for/functions/containers），并分离
          # pytest 退出码与 skip 判定——理由见 .github/workflows/ci.yml 同名步骤注释（W106）。
          status=0
          python -m pytest -v -rs tests/test_*aot*.py > aot_run.log 2>&1 || status=$?
          cat aot_run.log
          if [ "$status" -ne 0 ]; then
            echo "::error::AOT 用例本身失败（pytest 退出码 $status）"
            exit "$status"
          fi
          if grep -q "skipped" aot_run.log; then
            echo "::error::AOT 端到端用例出现 skip —— FreeBSD 自带 clang，不应跳过"
            exit 1
          fi
          echo "AOT 端到端用例全部运行，无跳过"

      # ===== W121（v0.25.0）：把发布准入的两道检查搬进 CI =====
      #
      # 这两步此前**只存在于人的手上**：G20 靠人记得看 check_stdlib_contract.py
      # 末尾那行提示，wheel e2e 只有 .ps1 版、这台 runner 上没有 pwsh。结果是
      # 「发布前必过」写在文档里，实际每次发版都靠人不忘。BACKLOG §10 那次
      # 事故（PyPI 0.4.1 的 wheel 里零个 stdlib 文件，坏了三个版本没人发现）
      # 就是这个缺口的实测代价。
      #
      # 只构建一次 wheel，G20 与 e2e 共用——省掉一次 `python -m build`。
      - name: 构建 wheel（供 G20 与 e2e 复用）
        run: |
          . "$VENV_BIN/activate"
          rm -rf dist
          python -m build --wheel
          WHEEL="$(ls -1t dist/*.whl | head -n 1)"
          test -f "$WHEEL" || { echo "::error::构建后 dist/ 里没有 .whl"; exit 1; }
          echo "WHEEL=$WHEEL" >> "$GITHUB_ENV"
          echo "wheel = $WHEEL"

      - name: G20 门禁 - wheel 内容（必需资源 / 无 pyc / 块数 / 块背衬 .py）
        run: |
          . "$VENV_BIN/activate"
          python scripts/check_wheel_contents.py "$WHEEL"

      # 唯一能抓住「editable 假绿」的一步：全新 venv、非 editable、--no-deps。
      # 注意它断言的是**内容**而不只是退出码——词典没随包发行时 `分词` 会静默
      # 退化成逐字切，退出码照样 0。
      - name: 干净 venv wheel e2e 验收
        run: |
          . "$VENV_BIN/activate"
          sh scripts/verify_wheel_e2e.sh "$WHEEL"

      # 三包同发，lsp / dap 的 sdist+wheel 此前从未在任何 CI 里构建过——
      # v0.24.0 给它们钉了 `jikuai>=0.24.0` 下界，元数据坏掉只有发版当天才知道。
      # 这里只构建 + 查元数据，不装（装了要解析依赖，主包还没上线的版本号会失败，
      # 那是预期不是缺陷，见 v0.24-lessons 坑 2）。
      #
      # **不用 `twine check`**（W127）：twine → readme_renderer → `nh3`，nh3 是 Rust
      # 扩展、PyPI 上没有 FreeBSD 轮子，pip 只能回源码构建，于是要 maturin + Rust，
      # 实测直接失败（`Rust not found` / `Unsupported platform: 311`）。查过
      # readme_renderer 42/43/44/45 的 requires_dist，全都钉 nh3，没有「换版本就
      # 不用 Rust」这条路。改用 scripts/check_dist_metadata.py（G21，纯标准库）承接
      # 我们真正需要的那部分断言；「long_description 能否在 PyPI 页面渲染」这一项
      # 它不覆盖，由发版流程里人做的 TestPyPI 预演兜住。
      - name: 构建 lsp / dap 两包 + G21 三包元数据门禁
        run: |
          . "$VENV_BIN/activate"
          rm -rf lsp/dist dap/dist
          python -m build --outdir lsp/dist lsp
          python -m build --outdir dap/dist dap
          python scripts/check_dist_metadata.py dist lsp/dist dap/dist



      # W128：先把 coverage 的 **C tracer** 弄到位，再跑门禁。
      #
      # 第一次真跑（W127 之后）这一步 20m43s 只走到 45%，日志开头写着：
      #   CoverageWarning: Couldn't import C tracer: No module named
      #   'coverage.tracer' (no-ctracer)
      # 那不是卡住也不是超时，是**回退到纯 Python tracer**了 —— 逐行回调走 Python 层，
      # 比 C tracer 慢一个数量级，照 45% / 20m 外推整跑要 ~45 分钟。而 PyPI 上
      # coverage 没有 FreeBSD 轮子，pip 只能装 sdist；建 venv 那会儿扩展没编出来，
      # coverage 就静默降级了（它设计如此，缺 C tracer 只 warn 不报错）。
      #
      # 现在能修是因为 W125 已经确认这台机器有 clang（`cc` 指向它）—— 强制
      # `--no-binary` 重装一次，扩展就地编出来。持久 venv 会留着它，只有第一次花时间。
      #
      # **编不出来就明确失败，不静默走慢路**：慢到 45 分钟的门禁等于没有门禁，
      # 它会先撞上 runner 的 job 超时，然后被人当噪音关掉。
      - name: 确保 coverage 用 C tracer（纯 Python tracer 慢一个数量级）
        run: |
          . "$VENV_BIN/activate"
          if python -c "import coverage.tracer" 2>/dev/null; then
            echo "C tracer 已在位"
          else
            echo "C tracer 缺失，用 clang 就地重建 coverage"
            python -m pip install --force-reinstall --no-deps --no-binary coverage 'coverage>=7.0'
            python -c "import coverage.tracer; print('C tracer 重建成功:', coverage.tracer.__file__)"
          fi

      # 覆盖率两级阈值 —— **W122（v0.25.0）起是硬门禁**。

      #
      # 此前这一步是 `continue-on-error: true`，只负责打数字。当时的理由写得没错：
      # `docs/覆盖率下限.json` 的点阈值是 Windows + Python 3.14 实测标定的，在没
      # 标定过的第三个平台上直接开硬阈值，红了大概率是平台差异而不是真回归，那种
      # 红会训练人忽略门禁。
      #
      # 现在改判，依据是两条：
      #   1. 阈值已在**两个**平台被真正执行并通过 —— Windows 本机实测，以及
      #      2026-08-14 commit 48014bd 之后 github 那条 `Coverage thresholds
      #      (Python 3.12, ubuntu)` job 首次真跑通过（记在 覆盖率下限.json
      #      的 `_已知风险` 里）。跨平台落差没有大到吃掉那 ~5 个点的余量。
      #   2. 更要紧的是 **github/gitcode 两条流水线在本机推不上去（反复 300s
      #      超时）**，能稳定跑的只有 gitea 这一条。门禁只长在跑不起来的流水线上
      #      等于没有门禁 —— 这正是 v0.22 那条「守卫绿≠守卫在守」教训的另一面。
      #
      # **红了怎么办**：先看是不是平台差异。是的话把 FreeBSD 实测数字补进
      # `docs/覆盖率下限.json` 的 `_实测` 字段（那里至今只有 Windows 一列），
      # 再带理由调阈值；**不许为了让流水线变绿而调低**（那条纪律写在同文件
      # `_阈值怎么定的` 里）。
      #
      # 成本：要在覆盖率模式下把全量测试再跑一遍，本 job 耗时大致翻倍。
      # `timeout-minutes` 是 W128 加的护栏：真跑过一次 20m43s 才走到 45%（纯 Python
      # tracer），与其让它慢慢啃掉整台 runner 的时间片再撞 job 级超时，不如在这里
      # 明确断掉 —— **超时本身就是要报的结论**（说明 C tracer 那步没生效）。
      - name: 覆盖率门禁（点阈值 + 面阈值）
        timeout-minutes: 25
        run: |
          . "$VENV_BIN/activate"
          python scripts/coverage_baseline.py --检查下限 --按覆盖率升序
          echo "上面的数字是 FreeBSD 实测值；与 docs/覆盖率下限.json 的 _实测 字段（Windows）比对，差值就是跨平台落差。"



# trigger: re-push to fire Actions (content-API 偶发丢事件)
