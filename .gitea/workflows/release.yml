# 极快 JiKuai · 发版流水线（Gitea Actions）· v0.25.0 W123
#
# 触发：推 `vX.Y.Z` 形式的 tag。
#
# **它不上传。** 这一版刻意做成半自动：跑完全套发布准入检查、把三包产物留在 runner
# 的持久目录，最后那条 `twine upload` 仍由人执行。三条理由：
#
#   1. **发正式 PyPI 不可逆**。版号发错无法覆盖，撤只能 yank，而 yank 连 API
#      都没有（`pypi-` token 只授权 upload 端点，yank 走登录 session + CSRF
#      的网页表单）—— 见 v0.24 教训坑 1。自动化一个不可逆且撤不回的动作，
#      收益远小于风险。
#   2. **Gitea 用不了 PyPI Trusted Publishing**。OIDC 那套只认 GitHub /
#      GitLab / Google Cloud 等几个身份提供方，自建 Gitea 不在名单里。所以
#      「不再存长效 token」这条在 gitea 上做不到 —— 要自动上传就得把长效
#      `pypi-` token 存进 Gitea secret。半自动方案则**一个 token 都不用存**。
#   3. 真正值钱的部分不是那条 upload 命令，是它前面那串检查。人肉发版出事故
#      从来不是因为敲不对 twine，而是因为漏跑 G20 / e2e —— PyPI 上那个坏了
#      三个版本的 `jikuai 0.4.1` 就是这么出去的（BACKLOG §10）。
#
# 要改成全自动上传的话：加一个 `twine upload` 步骤 + `secrets.PYPI_TOKEN`，
# 并把本文件顶部这段理由一起改掉，别偷偷加。

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  发布准入:
    runs-on: freebsd
    steps:
      - name: Checkout
        uses: http://192.168.1.5:3000/actions/checkout@v4

      - name: 准备持久 venv
        run: |
          # 刻意**不**装 twine：它在这台 FreeBSD runner 上装不上（twine →
          # readme_renderer → nh3，nh3 是 Rust 扩展且无 FreeBSD 轮子，pip 回源码
          # 构建要 maturin + Rust，实测失败）。元数据检查改用 G21，纯标准库。
          # 真正的 `twine upload` 由人在自己机器上执行，见本 job 最后一步。
          VENV_BIN="$(/usr/local/sbin/ci_venv.sh jikuai 'pytest coverage[toml] build')"
          echo "VENV_BIN=$VENV_BIN" >> "$GITHUB_ENV"
          ln -sfn "$PWD" "/var/db/act_runner/venvs/jikuai.src"
          "$VENV_BIN/pip" install -e "/var/db/act_runner/venvs/jikuai.src" --no-build-isolation >/dev/null 2>&1 || "$VENV_BIN/pip" install -e . --no-build-isolation >/dev/null 2>&1 || true

      # tag 名与代码里的版本号必须一致。G15 只保证「_version.py ↔ pyproject ↔
      # CHANGELOG ↔ 扩展 package.json」四处互相一致，它管不到 tag —— 打错 tag
      # 照样能过 G15，然后发出去一个版号与 tag 不符的包。
      - name: 断言 tag 与 _version.py 一致
        run: |
          . "$VENV_BIN/activate"
          TAG="${GITHUB_REF#refs/tags/v}"
          VER="$(python -c 'import sys; sys.path.insert(0, "src"); from jikuai._version import __version__; print(__version__)')"
          echo "tag=$TAG  _version=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG 与 jikuai._version.__version__ ($VER) 不一致"
            exit 1
          fi

      - name: 确认 C 编译器在位（全量测试里的 AOT e2e 需要）
        run: |
          . "$VENV_BIN/activate"
          # 查 cc/clang 而非 gcc：FreeBSD base 自带 clang，没有 gcc。理由同
          # ci.yml 的 W125 修正。缺编译器会让 AOT e2e 静默 skip，发版前该拦住。
          cc --version || clang --version
          python -c "import shutil, sys; c = shutil.which('gcc') or shutil.which('clang') or shutil.which('cc'); print('cc ->', c); sys.exit(0 if c else 1)"

      - name: 全量测试
        run: |
          . "$VENV_BIN/activate"
          python -m pytest -q

      - name: 契约门禁 G10-G25


        run: |
          . "$VENV_BIN/activate"
          python scripts/check_stdlib_contract.py

      - name: 构建三包（sdist + wheel）
        run: |
          . "$VENV_BIN/activate"
          rm -rf dist lsp/dist dap/dist
          python -m build
          python -m build --outdir lsp/dist lsp
          python -m build --outdir dap/dist dap
          ls -l dist lsp/dist dap/dist
          WHEEL="$(ls -1t dist/*.whl | head -n 1)"
          echo "WHEEL=$WHEEL" >> "$GITHUB_ENV"

      - name: G20 门禁 - wheel 内容
        run: |
          . "$VENV_BIN/activate"
          python scripts/check_wheel_contents.py "$WHEEL"

      - name: G21 门禁 - 三包发行元数据（含 wheel/sdist 成对）
        run: |
          . "$VENV_BIN/activate"
          # --要求成对：发版时三包都得 sdist + wheel 全套，缺一种等于少发一条安装路径。
          # 常规 CI 不加这个开关（主包是 --wheel 单构的，缺 sdist 是预期）。
          python scripts/check_dist_metadata.py --要求成对

      # 发布准入最后一道、也是最要紧的一道：干净 venv、非 editable、--no-deps。
      # 它断言的是**内容**（分词能否整词切出「个人所得税」、stdlib 是否落在
      # site-packages）而不只是退出码 —— 词典没随包发行时退出码照样 0。
      - name: 干净 venv wheel e2e 验收
        run: |
          . "$VENV_BIN/activate"
          sh scripts/verify_wheel_e2e.sh "$WHEEL"

      # 刻意**不用** `actions/upload-artifact`：这台自建 gitea 只镜像了
      # `actions/checkout`，`http://192.168.1.5:3000/actions/upload-artifact` 这个仓库
      # **不存在**。而 gitea 会在 **job setup 阶段一次性解析所有 `uses:`**，所以缺一个
      # action 会让**整个 job 在第一步之前就红** —— v0.25.0 首跑实测：`repository not
      # found`，0 个 step 执行过，连 tag↔版本号断言都没跑到。`ci.yml` 一直没踩到这个坑，
      # 是因为它一个 `uses:` 都不用（除 checkout）。
      #
      # 所以这一步用纯 shell 做，**零外部 action 依赖**。它要守的是「产物留得下来、
      # 能被人取走」，不是「必须用 upload-artifact」。要换回 action 版，得先让管理员在
      # gitea 的 `actions` 组织下把 upload-artifact 镜像过来。
      - name: 留存产物到 runner 持久目录
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          out="/var/db/act_runner/artifacts/jikuai/$tag"
          rm -rf "$out"
          mkdir -p "$out"
          cp dist/* lsp/dist/* dap/dist/* "$out/"
          ls -l "$out"
          echo "OUT_DIR=$out" >> "$GITHUB_ENV"

      - name: 下一步该人做什么
        run: |
          echo '发布准入全绿。三包产物（sdist + wheel × 3）留在 runner 上：'
          echo "  $OUT_DIR"
          echo ''
          echo '剩下两步由人执行（本流水线刻意不做，理由见本文件顶部注释）：'
          echo '  1. TestPyPI 预演：'
          echo '     python -m twine upload --repository testpypi dist/* lsp/dist/* dap/dist/*'
          echo '  2. 正式 PyPI（不可逆）：'
          echo '     python -m twine upload dist/* lsp/dist/* dap/dist/*'
          echo ''
          echo '注意：上面两条在**你自己的机器上**跑，用你本机 python -m build 构出来的'
          echo '产物即可 —— 本流水线的价值是「这套源码能构出合规产物」这个结论，'
          echo '不是那六个具体文件。要用 runner 上这份，从上面的路径拷走。'
          echo ''
          echo 'token 在仓库根 .env（TWINE_USERNAME / TWINE_PASSWORD，那是正式 PyPI 不是 TestPyPI）。'
          echo 'twine 要用 python -m 调。'

