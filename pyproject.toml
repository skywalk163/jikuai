[project]
name = "jikuai"
version = "0.4.1"
description = "极快 - 适合中国国情的中文编程语言"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "skywalk163"}
]
keywords = ["chinese", "programming-language", "中文编程"]

[project.scripts]
jikuai = "jikuai.main:main"
jk = "jikuai.main:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
