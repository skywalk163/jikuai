[project]
name = "jikuai"
dynamic = ["version"]
description = "极快 - 适合中国国情的中文编程语言"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "skywalk163"}
]
keywords = ["chinese", "programming-language", "中文编程"]

[project.scripts]
jikuai = "jikuai.main:main"
jk = "jikuai.main:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# W25（v0.16.0）：版本号单一真源，避免 pyproject / __init__ / main 三处漂移。
[tool.setuptools.dynamic]
version = {attr = "jikuai._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
