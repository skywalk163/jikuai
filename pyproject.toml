[project]
name = "jikuai"
dynamic = ["version"]
description = "极快 - 适合中国国情的中文编程语言"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "skywalk163"}
]
keywords = ["chinese", "programming-language", "中文编程"]

[project.scripts]
jikuai = "jikuai.main:main"
jk = "jikuai.main:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "coverage[toml]>=7.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# W114（v0.24.0 · ADR-39）：**stdlib 进包的真源是 `MANIFEST.in`，不在这里。**
#
# 起草时这里放过一份显式 `[tool.setuptools.package-data]` 白名单，注释还写着
# 「不用 include-package-data + MANIFEST.in 的组合，显式白名单更好审」。
# 执行期实测把这个前提证伪了：pyproject 配置下 setuptools 的
# `include_package_data` **默认为 true**，MANIFEST.in 因此同时管着 wheel。
# 铁证是 9 个 `临时_测试*.txt`（块自测遗留产物）进了 wheel，而白名单里没有
# 任何模式能匹配它们——那份白名单从来不是过滤器，只是一份让人误判的副本。
#
# 于是删掉白名单，认 MANIFEST.in 为唯一真源。这个取舍是刻意的，因为两种机制
# 的失败模式不对称：
#   - 白名单（allow-list）漏一个扩展名 → **静默不打包 → 运行期炸**。
#     W114 差点就这么翻车：`blocks/**/*.py` 那 14 个混合模块背衬没列进去，
#     而 `圆分`（`财务/保留分/保留分.py`）被 13 个财务块引用，含 `个税`/`增值税`。
#   - 宽 recursive-include 收进垃圾 → **被 G20 门禁抓住**。
# 静默功能损坏比被抓住的垃圾危险得多，所以选后者 + 让门禁兜。
# G20（`scripts/check_wheel_contents.py`）既查该有的在不在，也查不该有的
# 有没有混进来。

# W25（v0.16.0）：版本号单一真源，避免 pyproject / __init__ / main 三处漂移。
[tool.setuptools.dynamic]
version = {attr = "jikuai._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

# W94（v0.21.0 · M24）：覆盖率基线。
# 只量 src/jikuai/（运行时），lsp/、tools/、scripts/、benches/ 不进基线——
# 那些是「靠 e2e/契约门禁自证」的边缘（服务端脚本、门禁工具、bench）。
# 分支覆盖打开，因为大量控制流分支存在于 lexer/parser/interpreter。
#
# W97（v0.22.0 · M25）：**必须开 parallel** —— 全仓有 17 个测试文件用
# `subprocess` 起子进程（LSP `python -m jikuai_lsp`、注册表服务端、CLI 跑 .jk）。
# coverage 默认只记父进程，v0.21.0 那次基线因此把 completion.py 记成 25.8%，
# 而它其实在 LSP 子进程里被整条打过。parallel 让每个进程写各自的
# `.coverage.<host>.<pid>`，再靠 `coverage combine` 汇总。
# 子进程还需要在启动时调 `coverage.process_startup()`——见
# `scripts/coverage_baseline.py`（装 .pth 钩子）与 `tests/conftest.py`（传环境变量）。
[tool.coverage.run]
source = ["src/jikuai"]
branch = true
parallel = true
sigterm = true
omit = [
    # C 后端生成的 runtime 头由生成器写盘、由 gcc 消费；Python 覆盖率不适用。
    "src/jikuai/aot/runtime.h",
    "src/jikuai/aot/runtime.c",
]

[tool.coverage.report]
skip_empty = true
show_missing = false
precision = 1
# W94 立的纪律：点阈值优先于面阈值，不追 95%（拍数字容易催生为覆盖率而写的
# 空测试）。W97 重测后真实基线 83.4%，已在 80 之上，故直接设 80 留 3.4 个点
# 缓冲吸收正常波动。**不进 G10-G19 门禁体系** —— 覆盖率是趋势指标不是契约。
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
